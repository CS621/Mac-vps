name: macOS Cloud Remote Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ngrok / Tailscale Tunnel
        run: |
          brew install ngrok
          # Put your Auth token and start TCP tunnel for VNC / Screen Sharing (Port 5900)
          ngrok authtoken ${{ secrets.NGROK_TOKEN }}
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -client_configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          ngrok tcp 5900 &

      - name: Keep Runner Alive
        run: |
          echo "macOS RDP Active! Connecting to VNC..."
          sleep 21600 # 6 hours max session
