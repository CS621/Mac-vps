name: macOS Cloud Remote Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          brew install tailscale
          sudo tailscaled --state=mem: &
          sleep 5
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-runner

      - name: Setup SSH Public Key Authentication
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Injecting Fossapup public key
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMGxA9CFvuRQYwiEg1TnzwgnS3lHSgU6e4ozIrgL7lE9 root@Samsung" >> ~/.ssh/authorized_keys
          
          chmod 600 ~/.ssh/authorized_keys

          # Enable SSH Remote Login
          sudo systemsetup -setremotelogin on

          # Enable VNC Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all

      - name: Keep Runner Alive
        run: |
          echo "=========================================="
          echo "macOS SSH Key Auth Ready!"
          echo "=========================================="
          sleep 21600
