name: macOS Cloud Remote Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          brew install tailscale
          sudo tailscaled --state=mem: &
          sleep 5
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-runner

      - name: Force SSH Key Auth & Fix Permissions
        run: |
          # 1. Setup runner user .ssh
          mkdir -p /Users/runner/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMGxA9CFvuRQYwiEg1TnzwgnS3lHSgU6e4ozIrgL7lE9 root@Samsung" > /Users/runner/.ssh/authorized_keys
          
          # Fix strict macOS permissions for SSH
          sudo chown -R runner:staff /Users/runner/.ssh
          chmod 700 /Users/runner/.ssh
          chmod 600 /Users/runner/.ssh/authorized_keys

          # 2. Patch macOS sshd_config to FORCE Public Key Auth
          sudo sed -i '' 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i '' 's/PasswordAuthentication yes/PasswordAuthentication no/g' /etc/ssh/sshd_config
          echo "StrictModes no" | sudo tee -a /etc/ssh/sshd_config
          echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config

          # 3. Enable SSH and Restart Daemon
          sudo systemsetup -setremotelogin on
          sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist

          # 4. Enable VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all

      - name: Keep Runner Alive
        run: |
          echo "=========================================="
          echo "SSH Forced Key Authentication Configured!"
          echo "=========================================="
          sleep 21600
