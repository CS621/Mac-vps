name: macOS Cloud Remote Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          brew install tailscale
          sudo tailscaled --state=mem: &
          sleep 5
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-runner

      - name: Setup Web VNC (noVNC)
        run: |
          brew install websockify
          brew install tiger-vnc-server

          # macOS VNC Enable
          sudo dscl . -passwd /Users/runner vncpass
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -client_configure -allowAccessFor -allUsers -privs -all -vnclegacy yes

          # Download & extract noVNC web interface
          git clone https://github.com/novnc/noVNC.git ~/novnc

          # Run websockify bridge on port 6080
          nohup ~/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /dev/null 2>&1 &
          sleep 3

      - name: Keep Runner Alive
        run: |
          echo "=========================================="
          echo "macOS Active! Access via Browser:"
          echo "http://100.71.131.33:6080/vnc.html"
          echo "Password: vncpass"
          echo "=========================================="
          sleep 21600
